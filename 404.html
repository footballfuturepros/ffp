<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title data-i18n="error_title">Page not found — Football Future Pros</title>
<meta name="robots" content="noindex">
<link rel="icon" type="image/x-icon" href="assets/favicon.ico">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<header class="site-header">
  <nav class="nav">
    <a href="/" class="brand" aria-label="Football Future Pros — home">
      <img src="assets/logo-mark.png" alt="Football Future Pros" width="44" height="44" style="display:block;">
      <span class="brand-name">FOOTBALL<br><b>FUTURE</b> PROS</span>
    </a>
    <div class="nav-right">
      <div class="lang-switch" role="group" aria-label="Language">
        <button data-lang="en" type="button">EN</button>
        <button data-lang="pt" type="button">PT</button>
        <button data-lang="es" type="button">ES</button>
      </div>
    </div>
  </nav>
</header>

<main>
  <section style="padding:120px 0; text-align:center;">
    <div class="wrap">
      <p class="eyebrow" style="justify-content:center;" data-i18n="error_eyebrow">PAGE NOT FOUND</p>
      <h1 style="font-size:clamp(40px,7vw,80px);" data-i18n="error_title">Offside.</h1>
      <p style="color:var(--floodlight-dim); font-size:18px; max-width:46ch; margin:22px auto 34px;" data-i18n="error_body">The page you're looking for doesn't exist, or the play has moved on.</p>
      <a href="/" class="btn btn-gold" data-i18n="error_cta">Back to Home</a>
    </div>
  </section>
</main>

<script src="i18n.js"></script>
<script src="script.js"></script>
</body>
</html>
